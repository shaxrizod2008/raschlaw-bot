<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test tekshiruvchi bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #f4f6f9;
            color: #1e293b;
            padding: 16px 14px 40px 14px;
        }
        .header-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #0284c7;
            margin-bottom: 10px;
        }
        .subject-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            color: #475569;
        }
        .subject-badge {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 600;
            color: #0f172a;
        }
        .q-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .q-title {
            font-size: 16px;
            font-weight: 700;
            color: #0284c7;
            margin-bottom: 12px;
        }
        .q-hint {
            font-size: 13px;
            font-weight: 400;
            color: #64748b;
            line-height: 1.35;
        }
        .options-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .options-grid-6 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }
        .opt-btn {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 11px 0;
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }
        .opt-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 3px 8px rgba(2, 132, 199, 0.3);
        }
        .written-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .written-label {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            min-width: 24px;
        }
        .written-input {
            width: 100%;
            padding: 11px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .written-input:focus {
            border-color: #f59e0b;
            background: #fffbeb;
        }
        .submit-btn {
            width: 100%;
            background: #16a34a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 14px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }
        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .success-modal {
            display: none;
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            margin-top: 40px;
        }
        .success-title {
            font-size: 21px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 14px;
        }
        .success-text {
            font-size: 15px;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 22px;
        }
        .exit-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div class="header-card">
        <div class="header-title" id="test-header">📘 Test yuklanmoqda...</div>
        <div class="subject-row">
            <span>Fan / Yo'nalish:</span>
            <span class="subject-badge" id="test-subject">Huquqshunoslik</span>
        </div>
    </div>

    <div id="questions-list"></div>

    <button class="submit-btn" id="submit-btn" onclick="submitAnswers()">✅ Javoblarni yuborish</button>
</div>

<div id="success-screen" class="success-modal">
    <div class="success-title">✅ Sizning natijangiz qabul qilindi!</div>
    <div class="success-text">
        Ushbu sahifadan chiqib bot orqali natijangiz haqida batafsil ma'lumot olishingiz mumkin.
    </div>
    <button class="exit-btn" onclick="closeApp()">⬅️ Chiqish</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const testId = urlParams.get('test_id');
    const userId = urlParams.get('user_id');

    let testConfig = null;
    const userAnswers = {};

    async function loadTest() {
        try {
            const res = await fetch(`/api/test/${testId}`);
            if (!res.ok) throw new Error("Test topilmadi");
            testConfig = await res.json();

            document.getElementById('test-header').innerText = `📘 Test №${testConfig.code} – ${testConfig.total_q} ta savol`;
            document.getElementById('test-subject').innerText = testConfig.subject;

            renderQuestions(testConfig.structure);
        } catch (err) {
            document.getElementById('test-header').innerText = "❌ Xatolik yuz berdi";
        }
    }

    function renderQuestions(structure) {
        const container = document.getElementById('questions-list');
        container.innerHTML = '';

        structure.forEach(item => {
            const card = document.createElement('div');
            card.className = 'q-card';

            if (item.type === 'abcd' || item.type === 'abcdef') {
                const options = item.type === 'abcd' ? ['A', 'B', 'C', 'D'] : ['A', 'B', 'C', 'D', 'E', 'F'];
                const gridClass = item.type === 'abcd' ? 'options-grid-4' : 'options-grid-6';

                let btnsHtml = `<div class="${gridClass}">`;
                options.forEach(opt => {
                    btnsHtml += `<div class="opt-btn" id="btn-${item.q}-${opt}" onclick="selectOption('${item.q}', '${opt}', ${JSON.stringify(options).replace(/"/g, '&quot;')})">${opt}</div>`;
                });
                btnsHtml += `</div>`;

                card.innerHTML = `
                    <div class="q-title">${item.q}-savol:</div>
                    ${btnsHtml}
                `;
            } else if (item.type === 'written_ab') {
                card.innerHTML = `
                    <div class="q-title">${item.q}-savol: <span class="q-hint">(Iloji boricha qisqa va aniq javob yozing.)</span></div>
                    <div class="written-row">
                        <span class="written-label">a)</span>
                        <input type="text" class="written-input" placeholder="a) band javobi..." oninput="setWritten('${item.q}_a', this.value)">
                    </div>
                    <div class="written-row">
                        <span class="written-label">b)</span>
                        <input type="text" class="written-input" placeholder="b) band javobi..." oninput="setWritten('${item.q}_b', this.value)">
                    </div>
                `;
            } else if (item.type === 'written_single') {
                card.innerHTML = `
                    <div class="q-title">${item.q}-savol: <span class="q-hint">(Yozma javobni kiriting.)</span></div>
                    <div class="written-row">
                        <input type="text" class="written-input" placeholder="Javobni yozing..." oninput="setWritten('${item.q}', this.value)">
                    </div>
                `;
            }
            container.appendChild(card);
        });
    }

    function selectOption(qKey, opt, allOpts) {
        userAnswers[qKey] = opt;
        allOpts.forEach(o => {
            const el = document.getElementById(`btn-${qKey}-${o}`);
            if (el) el.classList.remove('active');
        });
        const activeEl = document.getElementById(`btn-${qKey}-${opt}`);
        if (activeEl) activeEl.classList.add('active');
    }

    function setWritten(qKey, val) {
        userAnswers[qKey] = val.trim();
    }

    async function submitAnswers() {
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = "⏳ Yuborilmoqda...";

        try {
            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    test_code: testConfig.code,
                    user_id: userId,
                    answers: userAnswers
                })
            });
            const data = await res.json();
            if (data.ok) {
                document.getElementById('quiz-container').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';
                window.scrollTo(0, 0);
            } else {
                alert(data.error || "Xatolik yuz berdi!");
                btn.disabled = false;
                btn.innerText = "✅ Javoblarni yuborish";
            }
        } catch (e) {
            alert("Server bilan aloqa yo'q!");
            btn.disabled = false;
            btn.innerText = "✅ Javoblarni yuborish";
        }
    }

    function closeApp() {
        tg.close();
    }

    loadTest();
</script>
</body>
</html>
